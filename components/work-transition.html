<!-- ════════════════════════════════════════════════════════════════
     MODULAR STICKY INTERLUDE (Hero -> Selected Work)
     components/work-transition.html
     Fast 8-tile GPU modular morph, 100% reversible & low-end smooth
     ════════════════════════════════════════════════════════════════ -->
<section id="work-transition" class="wt-stage" aria-label="Transition to Selected Work">
    <div class="wt-sticky" id="wt-sticky">
        <div class="wt-tiles" id="wt-tiles" aria-hidden="true">
            <div class="wt-tile" style="transform-origin: left top;"></div>
            <div class="wt-tile" style="transform-origin: right top;"></div>
            <div class="wt-tile wt-tile-accent" style="transform-origin: center top;"></div>
            <div class="wt-tile" style="transform-origin: right center;"></div>
            <div class="wt-tile wt-tile-accent" style="transform-origin: left center;"></div>
            <div class="wt-tile" style="transform-origin: center bottom;"></div>
            <div class="wt-tile" style="transform-origin: left bottom;"></div>
            <div class="wt-tile" style="transform-origin: right bottom;"></div>
        </div>

        <div class="wt-grid-floor" aria-hidden="true"></div>

        <div class="wt-copy" id="wt-copy">
            <span class="wt-kicker">[ 02 // WORK_MORPH ]</span>
            <h2 class="wt-title">05 SHIPPED BUILDS</h2>
            <p class="wt-sub">From prompts &amp; SQL schemas to deployed apps.</p>
            <span class="wt-dir-pill" id="wt-dir-pill">SCROLL &darr;</span>
        </div>
    </div>
</section>
