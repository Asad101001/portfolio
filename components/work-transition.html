<!-- ════════════════════════════════════════════════════════════════
     MODULAR SCROLL-MORPH INTERLUDE (Hero -> Selected Work)
     components/work-transition.html
     Bidirectional sticky stage: organizes points -> ink/amber tiles
     ════════════════════════════════════════════════════════════════ -->
<section id="work-transition" class="wt-stage" aria-label="Selected Work Transition">
    <div class="wt-sticky" id="wt-sticky">
        <canvas id="wt-canvas" aria-hidden="true"></canvas>

        <!-- 16 (4x4) spatial Neo-Brutalist modular tiles -->
        <div class="wt-tiles" id="wt-tiles" aria-hidden="true">
            <div class="wt-tile" style="transform-origin: left top;"></div>
            <div class="wt-tile" style="transform-origin: center top;"></div>
            <div class="wt-tile" style="transform-origin: right top;"></div>
            <div class="wt-tile" style="transform-origin: left center;"></div>
            <div class="wt-tile" style="transform-origin: center center;"></div>
            <div class="wt-tile" style="transform-origin: right center;"></div>
            <div class="wt-tile" style="transform-origin: left bottom;"></div>
            <div class="wt-tile" style="transform-origin: right bottom;"></div>
            <div class="wt-tile wt-tile-amber" style="transform-origin: center bottom;"></div>
            <div class="wt-tile" style="transform-origin: left top;"></div>
            <div class="wt-tile" style="transform-origin: right center;"></div>
            <div class="wt-tile" style="transform-origin: center top;"></div>
            <div class="wt-tile" style="transform-origin: left bottom;"></div>
            <div class="wt-tile wt-tile-amber" style="transform-origin: right top;"></div>
            <div class="wt-tile" style="transform-origin: center bottom;"></div>
            <div class="wt-tile" style="transform-origin: right bottom;"></div>
        </div>

        <div class="wt-perspective-grid" aria-hidden="true"></div>

        <div class="wt-copy" id="wt-copy">
            <span class="wt-kicker">[ 02 // WORK_INDEX ]</span>
            <h2 class="wt-title">05 SHIPPED PROJECTS</h2>
            <p class="wt-sub">From prompts &amp; SQL schemas to deployed products.</p>
            <span class="wt-dir-pill" id="wt-dir-pill">MORPHING &rarr; WORK &darr;</span>
        </div>

        <div class="wt-exit-curtain" id="wt-exit-curtain" aria-hidden="true"></div>
    </div>
</section>
